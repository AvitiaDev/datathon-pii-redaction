name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.deps }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        deps: [full, no-cryptography]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "full" ]; then
            pip install "numpy>=1.26" "cryptography>=41"
          else
            pip install "numpy>=1.26"   # vault must fall back to OpenSSL via ctypes
          fi
      - name: Syntax check
        run: python -m compileall -q src app tests scripts
      - name: Shell syntax check
        run: for f in run_all.sh scripts/*.sh; do bash -n "$f"; done
      - name: Unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -v
      - name: Secret hygiene
        run: |
          # fail if key material or raw data is ever committed
          if git ls-files | grep -E '(^|/)(keys|models|data/raw|data/processed|logs|data/demo)/|\.(pem|key|enc|npz)$'; then
            echo "Tracked secret, model or raw-data file found"; exit 1
          fi
